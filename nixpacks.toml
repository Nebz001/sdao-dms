# Railway / Nixpacks build configuration.
#
# PHP version is deliberately NOT pinned here. Nixpacks' PHP provider derives
# it solely from composer.json's `require.php` field (it never reads
# composer.lock and honours no env var), so "php": "^8.4.1" there is what
# selects the php84 toolchain. Overriding [phases.setup] would mean
# re-declaring the provider's entire generated nixPkgs list (php84 with
# extensions, nginx, libmysqlclient, composer, Node's packages) by hand --
# redundant and fragile.

[phases.install]
# This list REPLACES the PHP provider's auto-generated install commands
# entirely (no "..." token) so composer only ever runs once, --no-dev.
#
# The provider's own get_install() would normally emit:
#   mkdir -p /var/log/nginx && mkdir -p /var/cache/nginx
#   composer install --ignore-platform-reqs      (dev deps included)
#   npm ci                                       (from package-lock.json)
# Lines 1 and 3 below are hand-copied from that generated set so nginx's
# log/cache dirs and the Node install are still preserved. Line 2 is
# replaced outright: the generated composer call installs dev dependencies,
# and pestphp/pest-plugin-browser (dev-only) requires ext-sockets, which
# isn't in the default Nix PHP extension set -- that's what was failing.
# We never want dev deps in the production image anyway, so skip that pass
# entirely instead of installing everything and re-installing without dev.
#
# No --ignore-platform-reqs here, on purpose: the real php84 binary is on
# PATH and must genuinely satisfy the locked prod requirements (>=8.4.1,
# plus prod ext-*, all of which are default-enabled). If it ever doesn't,
# fail loudly here rather than inside an obscure post-autoload-dump crash.
cmds = [
    "mkdir -p /var/log/nginx && mkdir -p /var/cache/nginx",
    "composer install --no-dev --optimize-autoloader --no-interaction --no-progress",
    "npm ci",
]
