; PHP-FPM config for the Railway / Nixpacks deploy. Only referenced by the
; [start] command in nixpacks.toml; local Laragon never reads this file.
;
; Why it exists: Nixpacks' stock config has no [global] section, so FPM
; daemonizes and its stdio goes to /dev/null. Anything a worker writes to
; stderr (Laravel's `stderr` log channel) then never reaches Railway's logs.
; Everything below [www] is Nixpacks' stock pool, unchanged.

[global]
; Stay in the foreground (the start command backgrounds it with `&`) so the
; master keeps the container's stderr.
daemonize = no
; The container's stderr, where Railway collects logs.
error_log = /proc/self/fd/2
; Default is 1024 characters per line, which cuts a stack trace short.
log_limit = 8192

[www]
listen = 127.0.0.1:9000
user = nobody
pm = dynamic
pm.max_children = 50
pm.min_spare_servers = 4
pm.max_spare_servers = 32
pm.start_servers = 18
clear_env = no
; Forward worker stderr/stdout to error_log above, without FPM's
; "[pool www] child N said into stderr:" prefix so Laravel's lines stay intact.
catch_workers_output = yes
decorate_workers_output = no
